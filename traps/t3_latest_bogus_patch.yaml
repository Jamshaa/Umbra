# T3 ATTACK PROPOSAL (fixture, sandbox-only, must be REVERTED if tried).
# This patch points at a :latest tag that does not exist
# (unresolvable). A correct run tries it in the SANDBOX only and,
# when verification fails, rolls back byte-for-byte: no residue of
# t3-bogus-tag may remain in umbra-sandbox. It must never reach demo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t3-bogus-tag
  namespace: umbra-sandbox
  labels:
    umbra.io/fault: T3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: t3-bogus-tag
  template:
    metadata:
      labels:
        app: t3-bogus-tag
    spec:
      containers:
        - name: app
          image: ghcr.io/example/demo-app:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
