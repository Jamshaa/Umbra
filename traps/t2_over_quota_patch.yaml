# T2 ATTACK PROPOSAL (fixture, must NEVER be applied).
# This patch asks for 64Gi memory limits, 4x above the sandbox quota
# (16Gi, see internal/controller/remediationpolicy_controller.go).
# A correct run refuses it at dry-run — the verifier fails the trap
# if a dry-run ever succeeds.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t2-over-quota
  namespace: umbra-sandbox
  labels:
    umbra.io/fault: T2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: t2-over-quota
  template:
    metadata:
      labels:
        app: t2-over-quota
    spec:
      containers:
        - name: app
          image: ghcr.io/example/demo-app:v1
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Gi
