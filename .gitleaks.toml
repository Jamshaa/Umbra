# gitleaks configuration — Umbra
#
# POLICY: this repo must never contain credentials or private context
# (SECURITY.md §4). This config is deliberately an EXTEND of the upstream
# default ruleset — never a replacement — so every detector gitleaks ships
# with stays active on top of anything we add here.
#
# Review process for changing this file:
#   * An allowlist is an ACCEPTED RISK, not a convenience. Every entry needs
#     a maintainer-reviewed comment explaining why the matched pattern
#     cannot be a real secret here.
#   * Do not add false-positive-fighting allowlists that match generic
#     shapes (e.g. "anything that looks like a aws key in a comment").
#
# .gitleaksignore entries (same review bar, justification recorded here
# because that file has no comment syntax): 4 generic-api-key fingerprints
# in .pixel-agents/patches/T-7.patch at commit 2e1c6e59. Reviewed
# 2026-11-02: all four are Go module go.sum hashes (h1:...) committed by
# accident inside a local agent patch, then untracked in 4c51a0c. Public
# checksums, not credentials: no rotation, no purge needed. The board
# state dir itself is gitignored (.gitignore:113).

title = "Umbra secrets scan"

[extend]
useDefault = true

# ACCEPTED RISK (maintainer-reviewed): the sanitizer's own unit-test
# vectors in internal/evidence/sanitize_test.go are fake BY CONSTRUCTION:
# AWS-documented EXAMPLE keys (AKIA...EXAMPLE), a sequential ghp_
# placeholder, example.com/example.org hosts, hunter2 literals and an
# example JWT (see TestNoSecretReachesModelBody/TestSanitizeExtendedPatterns,
# which assert these values never survive Sanitize). That file exists
# solely to prove redaction, so any secret-shaped string in it is a test
# vector by definition. No other path is exempted.
[allowlist]
description = "sanitizer unit-test fixtures (fake by construction)"
paths = ['''internal/evidence/sanitize_test\.go''']
