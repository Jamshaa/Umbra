# ─────────────────────────────────────────────────────────────────────────────
# ci.yml — lint & test pipeline for the Umbra repository
#
#
# Contributors: do not weaken jobs to make red builds green. If a job fails,
# either fix the commit or make the job's intent more precise — never a
# blanket skip. (Exception: a legitimate new allowlist entry must go through
# .gitleaks.toml review, see that file.)
#
# Secrets scanning is NOT here — it has its own, stricter workflow:
# see .github/workflows/security.yml
# ─────────────────────────────────────────────────────────────────────────────
name: ci

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  go:
    name: Go (build, vet, test, format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1

  python-lint:
    name: ruff (format & lint, gates Python sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install ruff
        run: pip install "ruff==0.17.3"
      - name: Run ruff
        run: |
          if compgen -G '**/*.py' > /dev/null; then
            ruff check --output-format=github .
            ruff format --check .
          else
            echo "no Python sources yet (scaffold phase) — nothing to lint"
          fi


  yaml-hygiene:
    name: YAML parse check (manifests & workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Parse-check all tracked YAML
        run: |
          pip install "pyyaml==6.0.3"
          python - <<'PY'
          import glob, sys, yaml
          files = [p for p in glob.glob("**/*.y*ml", recursive=True)
                   if not p.startswith(("node_modules/", ".venv/"))]
          failures = []
          for path in files:
              try:
                  with open(path, "r", encoding="utf-8") as fh:
                      list(yaml.safe_load_all(fh))
              except Exception as exc:
                  failures.append(f"{path}: {exc}")
          if failures:
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)
          print(f"ok: {len(files)} YAML files parse cleanly")
          PY

  bench-catalog:
    name: Bench catalog coherence (cases.yaml vs tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Run bench catalog gate
        run: |
          pip install "pyyaml==6.0.3"
          python3 scripts/bench/check.py

  docs-numbers:
    name: Docs numbers are generated (scoreboard tables)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Check generated bench tables
        run: python3 scripts/docs/render_tables.py --check

  docs-claims:
    name: Docs claims lint (no unbuilt features as facts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Run claims lint
        run: python3 scripts/docs/claims_lint.py

  docker-build:
    name: Docker images build (no push, no registry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build images from scratch Dockerfiles (no push, no kind load)
        run: bash scripts/build-images.sh
        env:
          KIND_LOAD_SKIP: "1"

  ui:
    name: UI lint + build (catches undefined identifiers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint for undefined identifiers
        run: npx eslint src/
      - name: Production build
        run: npm run build
