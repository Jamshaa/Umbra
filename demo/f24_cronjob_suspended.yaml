apiVersion: batch/v1
kind: CronJob
metadata:
  name: f24-suspended
  namespace: demo
  labels:
    umbra.io/fault: F24
spec:
  # F24: suspended CronJob: scheduling silently stopped,
  # nobody notices the backup no longer runs. Do not remove suspend.
  schedule: "0 3 * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            umbra.io/fault: F24
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: busybox:1.36
              command: ["/bin/sh", "-c", "echo backup-ok"]
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
