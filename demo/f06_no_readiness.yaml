apiVersion: apps/v1
kind: Deployment
metadata:
  name: f06-no-readiness
  namespace: demo
  labels:
    umbra.io/fault: F06
spec:
  replicas: 1
  selector:
    matchLabels:
      app: f06-no-readiness
  template:
    metadata:
      labels:
        app: f06-no-readiness
        umbra.io/fault: F06
    spec:
      containers:
        - name: app
          image: demo-app:local
          # F06: deliberately WITHOUT readiness probe. The pod starts
          # but never shows Ready (nor does the Service select it). The
          # liveness IS defined (the failure is only the missing
          # readiness). Do not add readinessProbe.
          ports:
            - containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
