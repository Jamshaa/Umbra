apiVersion: apps/v1
kind: Deployment
metadata:
  name: f03-huge-requests
  namespace: demo
  labels:
    umbra.io/fault: F03
spec:
  replicas: 1
  selector:
    matchLabels:
      app: f03-huge-requests
  template:
    metadata:
      labels:
        app: f03-huge-requests
        umbra.io/fault: F03
    spec:
      containers:
        - name: app
          image: demo-app:local
          # F03: deliberately unsatisfiable requests
          # (cpu=64, memory=1Ti) -> the Pod stays Pending, never scheduled.
          resources:
            requests:
              cpu: "64"
              memory: 1Ti
          ports:
            - containerPort: 8080
