apiVersion: apps/v1
kind: Deployment
metadata:
  name: f21-missing-pull-secret
  namespace: demo
  labels:
    umbra.io/fault: F21
spec:
  replicas: 1
  selector:
    matchLabels:
      app: f21-missing-pull-secret
  template:
    metadata:
      labels:
        app: f21-missing-pull-secret
        umbra.io/fault: F21
    spec:
      # F21: imagen de registro privado SIN imagePullSecrets: el
      # kubelet no puede autenticarse y el pod nunca arranca.
      # Resources y probes sanos para aislar el fallo.
      # No anadir imagePullSecrets.
      containers:
        - name: app
          image: ghcr.io/example/demo-app:v1
          ports:
            - containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
