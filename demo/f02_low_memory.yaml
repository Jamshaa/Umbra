apiVersion: apps/v1
kind: Deployment
metadata:
  name: f02-low-memory
  namespace: demo
  labels:
    umbra.io/fault: F02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: f02-low-memory
  template:
    metadata:
      labels:
        app: f02-low-memory
        umbra.io/fault: F02
    spec:
      containers:
        - name: app
          image: busybox:1.36
          # F02: deliberately insufficient memory limit (8Mi).
          # The process retains ~32Mi: with 8Mi it dies in repeated OOMKilled;
          # with the fix (64Mi) it stabilizes. busybox provides /bin/sh.
          command: ["/bin/sh", "-c"]
          args:
            - a=$(head -c 33554432 /dev/zero | tr '\0' 'X'); sleep 3600
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 8Mi
          ports:
            - containerPort: 8080
