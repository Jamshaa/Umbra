apiVersion: apps/v1
kind: Deployment
metadata:
  name: f17-missing-configmap
  namespace: demo
  labels:
    umbra.io/fault: F17
spec:
  replicas: 1
  selector:
    matchLabels:
      app: f17-missing-configmap
  template:
    metadata:
      labels:
        app: f17-missing-configmap
        umbra.io/fault: F17
    spec:
      containers:
        - name: app
          image: ghcr.io/example/demo-app:v1
          # F17: reference to a ConfigMap that does NOT exist (f17-missing):
          # the container never gets created (CreateContainerConfigError).
          # Healthy resources and probes to isolate the failure. Do not create the
          # ConfigMap or remove the reference.
          envFrom:
            - configMapRef:
                name: f17-missing
          ports:
            - containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
