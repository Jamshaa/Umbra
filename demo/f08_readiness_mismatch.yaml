apiVersion: apps/v1
kind: Deployment
metadata:
  name: f08-readiness-mismatch
  namespace: demo
  labels:
    umbra.io/fault: F08
spec:
  replicas: 1
  selector:
    matchLabels:
      app: f08-readiness-mismatch
  template:
    metadata:
      labels:
        app: f08-readiness-mismatch
        umbra.io/fault: F08
    spec:
      containers:
        - name: app
          image: ghcr.io/example/demo-app:v1
          # F08: readiness points at port 8081, where nothing listens
          # (the app only opens 8080): the pod is live but NEVER Ready.
          # Liveness DOES point at 8080 (the failure is only the mismatch
          # of readiness). Do not fix the readinessProbe port.
          ports:
            - containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
