apiVersion: apps/v1
kind: Deployment
metadata:
  name: f08-readiness-mismatch
  namespace: demo
  labels:
    umbra.io/fault: F08
spec:
  replicas: 1
  selector:
    matchLabels:
      app: f08-readiness-mismatch
  template:
    metadata:
      labels:
        app: f08-readiness-mismatch
        umbra.io/fault: F08
    spec:
      containers:
        - name: app
          image: ghcr.io/example/demo-app:v1
          # F08: la readiness apunta al puerto 8081, donde nada escucha
          # (la app solo abre 8080): el pod vive pero NUNCA esta Ready.
          # La liveness SI apunta a 8080 (el fallo es solo el mismatch
          # de readiness). No corregir el puerto de la readinessProbe.
          ports:
            - containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
