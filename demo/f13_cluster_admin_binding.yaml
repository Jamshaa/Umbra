apiVersion: v1
kind: ServiceAccount
metadata:
  name: f13-overprivileged
  namespace: demo
  labels:
    umbra.io/fault: F13
---
# F13: this account stays bound to cluster-admin (total power over the
# cluster for a demo app). That is the failure: do not create this binding.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: f13-overprivileged-binding
  labels:
    umbra.io/fault: F13
subjects:
  - kind: ServiceAccount
    name: f13-overprivileged
    namespace: demo
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
