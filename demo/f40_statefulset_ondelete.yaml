apiVersion: v1
kind: Service
metadata:
  name: f40-headless
  namespace: demo
  labels:
    umbra.io/fault: F40
spec:
  clusterIP: None
  selector:
    app: f40-ondelete
  ports:
    - name: web
      port: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: f40-ondelete
  namespace: demo
  labels:
    umbra.io/fault: F40
spec:
  serviceName: f40-headless
  replicas: 2
  # F40: estrategia OnDelete: las nuevas versiones NUNCA se despliegan
  # solas, hay que borrar cada pod a mano. No cambiar a RollingUpdate.
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app: f40-ondelete
  template:
    metadata:
      labels:
        app: f40-ondelete
        umbra.io/fault: F40
    spec:
      containers:
        - name: app
          image: ghcr.io/example/demo-app:v1
          ports:
            - containerPort: 8080
              name: web
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
