apiVersion: apps/v1
kind: Deployment
metadata:
  name: f04-no-limits-bursty
  namespace: demo
  labels:
    umbra.io/fault: F04
spec:
  replicas: 1
  selector:
    matchLabels:
      app: f04-no-limits-bursty
  template:
    metadata:
      labels:
        app: f04-no-limits-bursty
        umbra.io/fault: F04
    spec:
      containers:
        - name: app
          image: busybox:1.36
          # F04: deliberately WITHOUT resources block (neither limits
          # nor requests) + bounded bursty allocator (~40Mi).
          # Uncapped, consumption is unbounded; with the fix
          # (limits 512Mi) restarts do not escalate.
          command: ["/bin/sh", "-c"]
          args:
            - a=""; i=0; while true; do a="$a$(head -c 5242880 /dev/zero|tr '\0' X)"; i=$((i+1)); if [ $i -ge 8 ]; then a=""; i=0; fi; sleep 2; done
          ports:
            - containerPort: 8080
