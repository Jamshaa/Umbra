apiVersion: batch/v1
kind: CronJob
metadata:
  name: f38-minutely
  namespace: demo
  labels:
    umbra.io/fault: F38
spec:
  # F38: runs EVERY MINUTE: hammers the cluster with junk Jobs and
  # can overlap runs if one takes more than 60 s.
  # Do not lower the frequency here: that is the fix.
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            umbra.io/fault: F38
        spec:
          restartPolicy: OnFailure
          containers:
            - name: hammer
              image: busybox:1.36
              command: ["/bin/sh", "-c", "echo hammer"]
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
