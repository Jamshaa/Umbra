apiVersion: batch/v1
kind: CronJob
metadata:
  name: f38-minutely
  namespace: demo
  labels:
    umbra.io/fault: F38
spec:
  # F38: corre CADA MINUTO: martillea el cluster con Jobs basura y
  # puede solapar ejecuciones si una tarda mas de 60 s.
  # No bajar la frecuencia aqui: ese es el fix.
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            umbra.io/fault: F38
        spec:
          restartPolicy: OnFailure
          containers:
            - name: hammer
              image: busybox:1.36
              command: ["/bin/sh", "-c", "echo hammer"]
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
