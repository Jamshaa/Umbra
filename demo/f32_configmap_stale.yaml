apiVersion: v1
kind: ConfigMap
metadata:
  name: f32-settings
  namespace: demo
  labels:
    umbra.io/fault: F32
data:
  # Initial value v1. The injector bumps it to v2 WITHOUT rollout: pods
  # keep v1 because the Deployment carries no checksum/config.
  version: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: f32-stale-config
  namespace: demo
  labels:
    umbra.io/fault: F32
spec:
  replicas: 1
  selector:
    matchLabels:
      app: f32-stale-config
  template:
    metadata:
      labels:
        app: f32-stale-config
        umbra.io/fault: F32
      # F32: WITHOUT checksum/config annotation -> changing the ConfigMap does not
      # trigger rollout and pods serve stale configuration.
      # Do not add the checksum.
    spec:
      containers:
        - name: app
          image: ghcr.io/example/demo-app:v1
          envFrom:
            - configMapRef:
                name: f32-settings
          ports:
            - containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
