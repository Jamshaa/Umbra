apiVersion: v1
kind: Secret
metadata:
  name: f33-rotated
  namespace: demo
  labels:
    umbra.io/fault: F33
type: Opaque
# Valores PLACEHOLDER (base64 de "token-v1"): ningun secreto real.
# El injector rota a "token-v2" sin rollout.
stringData:
  token: token-v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: f33-stale-secret
  namespace: demo
  labels:
    umbra.io/fault: F33
spec:
  replicas: 1
  selector:
    matchLabels:
      app: f33-stale-secret
  template:
    metadata:
      labels:
        app: f33-stale-secret
        umbra.io/fault: F33
      # F33: SIN anotacion checksum/secret -> rotar el Secret no provoca
      # rollout y los pods montan el valor antiguo. No anadir checksum.
    spec:
      containers:
        - name: app
          image: ghcr.io/example/demo-app:v1
          envFrom:
            - secretRef:
                name: f33-rotated
          ports:
            - containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
