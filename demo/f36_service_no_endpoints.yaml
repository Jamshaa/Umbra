apiVersion: v1
kind: Service
metadata:
  name: f36-no-endpoints
  namespace: demo
  labels:
    umbra.io/fault: F36
spec:
  # F36: the selector matches no pod: the Service exists
  # but has no endpoints and routes nothing. Do not align labels.
  selector:
    app: f36-nothing-matches-this
  ports:
    - name: web
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: f36-app
  namespace: demo
  labels:
    umbra.io/fault: F36
spec:
  replicas: 1
  selector:
    matchLabels:
      app: f36-app
  template:
    metadata:
      labels:
        app: f36-app
        umbra.io/fault: F36
    spec:
      containers:
        - name: app
          image: demo-app:local
          ports:
            - containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
