apiVersion: apps/v1
kind: Deployment
metadata:
  name: f19-command-typo
  namespace: demo
  labels:
    umbra.io/fault: F19
spec:
  replicas: 1
  selector:
    matchLabels:
      app: f19-command-typo
  template:
    metadata:
      labels:
        app: f19-command-typo
        umbra.io/fault: F19
    spec:
      containers:
        - name: app
          image: ghcr.io/example/demo-app:v1
          # F19: typo in the binary (pythno3 instead of python3): the
          # runtime cannot find the executable and the pod never starts.
          # Healthy resources and probes to isolate the failure (probes
          # never get to run). Do not fix the command.
          command: ["pythno3", "app.py"]
          ports:
            - containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
