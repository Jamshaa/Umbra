apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: f30-secret-read
  namespace: demo
  labels:
    umbra.io/fault: F30
rules:
  # F30: Secret reads the app does not need (get+list are enough
  # to exfiltrate them). Do not grant this access.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: f30-secret-read-binding
  namespace: demo
  labels:
    umbra.io/fault: F30
subjects:
  - kind: ServiceAccount
    name: default
    namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: f30-secret-read
