apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: f30-secret-read
  namespace: demo
  labels:
    umbra.io/fault: F30
rules:
  # F30: lectura de Secrets que la app no necesita (get+list bastan
  # para exfiltrarlos). No conceder este acceso.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: f30-secret-read-binding
  namespace: demo
  labels:
    umbra.io/fault: F30
subjects:
  - kind: ServiceAccount
    name: default
    namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: f30-secret-read
