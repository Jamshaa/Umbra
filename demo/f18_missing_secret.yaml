apiVersion: apps/v1
kind: Deployment
metadata:
  name: f18-missing-secret
  namespace: demo
  labels:
    umbra.io/fault: F18
spec:
  replicas: 1
  selector:
    matchLabels:
      app: f18-missing-secret
  template:
    metadata:
      labels:
        app: f18-missing-secret
        umbra.io/fault: F18
    spec:
      containers:
        - name: app
          image: ghcr.io/example/demo-app:v1
          # F18: referencia a un Secret que NO existe (f18-missing, nombre
          # placeholder sin material real): el contenedor no llega a
          # crearse (CreateContainerConfigError). Resources y probes
          # sanos para aislar el fallo. No crear el Secret.
          envFrom:
            - secretRef:
                name: f18-missing
          ports:
            - containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
