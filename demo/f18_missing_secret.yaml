apiVersion: apps/v1
kind: Deployment
metadata:
  name: f18-missing-secret
  namespace: demo
  labels:
    umbra.io/fault: F18
spec:
  replicas: 1
  selector:
    matchLabels:
      app: f18-missing-secret
  template:
    metadata:
      labels:
        app: f18-missing-secret
        umbra.io/fault: F18
    spec:
      containers:
        - name: app
          image: ghcr.io/example/demo-app:v1
          # F18: reference to a Secret that does NOT exist (f18-missing, name
          # placeholder with no real material): the container never gets to
          # be created (CreateContainerConfigError). Healthy resources and probes
          # healthy to isolate the failure. Do not create the Secret.
          envFrom:
            - secretRef:
                name: f18-missing
          ports:
            - containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
