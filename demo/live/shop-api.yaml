apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
  namespace: demo
  labels:
    app: shop-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-api
  template:
    metadata:
      labels:
        app: shop-api
    spec:
      containers:
        - name: app
          image: busybox:1.36
          # Healthy shop-api derived from demo/f02_low_memory.yaml: same
          # workload, 64Mi limit, ~8Mi real use, probes present.
          command: ["/bin/sh", "-c"]
          args:
            - httpd -f -p 8080 & a=$(head -c 8388608 /dev/zero | tr '\0' 'X'); sleep 3600
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
