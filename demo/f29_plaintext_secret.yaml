apiVersion: apps/v1
kind: Deployment
metadata:
  name: f29-plaintext-secret
  namespace: demo
  labels:
    umbra.io/fault: F29
spec:
  replicas: 1
  selector:
    matchLabels:
      app: f29-plaintext-secret
  template:
    metadata:
      labels:
        app: f29-plaintext-secret
        umbra.io/fault: F29
    spec:
      containers:
        - name: app
          image: ghcr.io/example/demo-app:v1
          # F29: secreto literal en el manifiesto (valor PLACEHOLDER
          # obvio, jamas una credencial real): cualquiera con acceso de
          # lectura al repo lo ve. Usar secretRef en su lugar.
          env:
            - name: DB_PASSWORD
              value: changeme-plaintext-NOT-A-SECRET
          ports:
            - containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
