apiVersion: apps/v1
kind: Deployment
metadata:
  name: f05-no-liveness
  namespace: demo
  labels:
    umbra.io/fault: F05
spec:
  replicas: 1
  selector:
    matchLabels:
      app: f05-no-liveness
  template:
    metadata:
      labels:
        app: f05-no-liveness
        umbra.io/fault: F05
    spec:
      containers:
        - name: app
          image: demo-app:local
          # F05: deliberately WITHOUT liveness probe. If the app
          # hangs, nothing restarts it. Readiness IS defined
          # (the failure is only the missing liveness). Do not add
          # livenessProbe.
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
