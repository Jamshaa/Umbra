apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: f15-secret-create
  namespace: demo
  labels:
    umbra.io/fault: F15
rules:
  # F15: la app solo lee ConfigMaps, pero este Role le concede crear
  # Secrets (escritura sobre material sensible que no necesita).
  # Es el fallo: no conceder create sobre secrets. No acotar la regla.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: f15-secret-create-binding
  namespace: demo
  labels:
    umbra.io/fault: F15
subjects:
  - kind: ServiceAccount
    name: default
    namespace: demo
roleRef:
  kind: Role
  name: f15-secret-create
  apiGroup: rbac.authorization.k8s.io
