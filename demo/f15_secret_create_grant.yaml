apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: f15-secret-create
  namespace: demo
  labels:
    umbra.io/fault: F15
rules:
  # F15: the app only reads ConfigMaps, but this Role grants it create on
  # Secrets (writes on sensitive material it does not need).
  # That is the failure: do not grant create on secrets. Do not scope down the rule.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: f15-secret-create-binding
  namespace: demo
  labels:
    umbra.io/fault: F15
subjects:
  - kind: ServiceAccount
    name: default
    namespace: demo
roleRef:
  kind: Role
  name: f15-secret-create
  apiGroup: rbac.authorization.k8s.io
