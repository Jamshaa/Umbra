apiVersion: apps/v1
kind: Deployment
metadata:
  name: f20-port-mismatch
  namespace: demo
  labels:
    umbra.io/fault: F20
spec:
  replicas: 1
  selector:
    matchLabels:
      app: f20-port-mismatch
  template:
    metadata:
      labels:
        app: f20-port-mismatch
        umbra.io/fault: F20
    spec:
      containers:
        - name: app
          image: ghcr.io/example/demo-app:v1
          # F20: probes point at port 9090, but the container
          # only opens 8080 (probe/container mismatch; a Service on
          # 9090 would fail the same). Healthy resources to isolate the failure.
          # Do not align the ports.
          ports:
            - containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
