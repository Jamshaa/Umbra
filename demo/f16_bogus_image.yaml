apiVersion: apps/v1
kind: Deployment
metadata:
  name: f16-bogus-image
  namespace: demo
  labels:
    umbra.io/fault: F16
spec:
  replicas: 1
  selector:
    matchLabels:
      app: f16-bogus-image
  template:
    metadata:
      labels:
        app: f16-bogus-image
        umbra.io/fault: F16
    spec:
      containers:
        - name: app
          # F16: nonexistent tag (never published): the pod stays in
          # ImagePullBackOff. Healthy resources and probes to isolate the
          # failure. Do not fix the tag.
          image: ghcr.io/example/demo-app:does-not-exist
          ports:
            - containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
