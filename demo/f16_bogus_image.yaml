apiVersion: apps/v1
kind: Deployment
metadata:
  name: f16-bogus-image
  namespace: demo
  labels:
    umbra.io/fault: F16
spec:
  replicas: 1
  selector:
    matchLabels:
      app: f16-bogus-image
  template:
    metadata:
      labels:
        app: f16-bogus-image
        umbra.io/fault: F16
    spec:
      containers:
        - name: app
          # F16: tag inexistente (nunca se publico): el pod queda en
          # ImagePullBackOff. Resources y probes sanos para aislar el
          # fallo. No corregir el tag.
          image: ghcr.io/example/demo-app:does-not-exist
          ports:
            - containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
