# Restrictive audit policy for the Umbra kind cluster.
# Logs only writes (create/update/patch) on workloads in
# demo namespaces. Everything else — including ALL read-only
# operations — falls through to the final `None` rule and is dropped.
# Metadata level: who (user), which verb, on what object, no
# request/response bodies, so the log never grows to gigabytes.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
rules:
  - level: Metadata
    namespaces: ["demo"]
    verbs: ["create", "update", "patch"]
    resources:
      - group: "apps"
        resources: ["deployments", "deployments/scale", "statefulsets", "daemonsets", "replicasets"]
      - group: ""
        resources: ["pods"]
  # Catch-all: do not log anything not listed above.
  - level: None
