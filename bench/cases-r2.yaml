# UmbraBench case catalog, wave 2: real-world faults (machine-readable).
#
# Same contract as bench/cases.yaml: each fault ships injector +
# verifier + catalog entry before any AI work. Statuses follow the
# same ladder (planned -> injector-ready -> verified). Traps from
# wave 1 stay in cases.yaml; wave 2 has no traps yet.
#
# seed/repeats mirror cases.yaml so a future harness can run both
# files with one configuration.

seed: 42
repeats: 3
cases:
  - id: F21
    category: Security
    injector: scripts/injectors/f21_missing_pull_secret.sh
    verifier: scripts/verify/f21_missing_pull_secret.sh
    expected_root_cause: Private-registry image without imagePullSecrets
    trap: false
    status: injector-ready
