apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: f14-wildcard
  namespace: demo
  labels:
    umbra.io/fault: F14
rules:
  # INCORRECT: narrows one rule but widens another with a wildcard.
  # The allowlist lets /rules through and the dry-run admits it (it is valid),
  # but the verifier rejects it: wildcards remain.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
