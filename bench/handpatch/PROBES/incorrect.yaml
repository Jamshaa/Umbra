apiVersion: apps/v1
kind: Deployment
metadata:
  name: probes-demo
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probes-demo
  template:
    metadata:
      labels:
        app: probes-demo
    spec:
      containers:
        - name: app
          image: demo-app:local
          ports:
            - containerPort: 8080
          # INCORRECT: keeps the probe identical (only changes the
          # delay, which the verifier ignores on purpose) instead of
          # telling it apart. Passes the allowlist (only touches readinessProbe)
          # but the verifier rejects it: it is still the failure.
          livenessProbe: {tcpSocket: {port: 8080}}
          readinessProbe: {tcpSocket: {port: 8080}, initialDelaySeconds: 30}
          resources:
            requests: {cpu: "10m", memory: "64Mi"}
            limits: {cpu: "100m", memory: "128Mi"}
