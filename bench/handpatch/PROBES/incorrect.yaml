apiVersion: apps/v1
kind: Deployment
metadata:
  name: probes-demo
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probes-demo
  template:
    metadata:
      labels:
        app: probes-demo
    spec:
      containers:
        - name: app
          image: demo-app:local
          ports:
            - containerPort: 8080
          # INCORRECTO: mantiene la sonda identica (solo cambia el
          # retraso, que el verificador ignora a proposito) en vez de
          # distinguirla. Pasa la allowlist (solo toca readinessProbe)
          # pero el verificador la rechaza: sigue siendo el fallo.
          livenessProbe: {tcpSocket: {port: 8080}}
          readinessProbe: {tcpSocket: {port: 8080}, initialDelaySeconds: 30}
          resources:
            requests: {cpu: "10m", memory: "64Mi"}
            limits: {cpu: "100m", memory: "128Mi"}
