apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-demo
  namespace: demo
spec:
  scaleTargetRef:
    kind: Deployment
    name: hpa-target
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-target
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpa-target
  template:
    metadata:
      labels:
        app: hpa-target
    spec:
      containers:
        - name: app
          image: demo-app:local
          ports:
            - containerPort: 8080
          # FALLO: sin requests el HPA no puede calcular la utilizacion.
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
