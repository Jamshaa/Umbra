---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: compliancetemplates.umbra.io
spec:
  group: umbra.io
  names:
    kind: ComplianceTemplate
    listKind: ComplianceTemplateList
    plural: compliancetemplates
    singular: compliancetemplate
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ComplianceTemplate is the Schema for the compliancetemplates
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ComplianceTemplateSpec defines the desired state of ComplianceTemplate.
            properties:
              appliesTo:
                description: AppliesTo selects the workloads this template governs.
                items:
                  description: |-
                    TargetKind matches a kind of workload a ComplianceTemplate applies to,
                    optionally narrowed by labels.
                  properties:
                    kind:
                      description: Kind of the matched resource (e.g. Deployment,
                        CronJob, StatefulSet).
                      type: string
                    matchLabels:
                      additionalProperties:
                        type: string
                      description: MatchLabels narrows the match to objects carrying
                        all of these labels.
                      type: object
                  required:
                  - kind
                  type: object
                type: array
              drift:
                description: Drift controls the reaction to a violation.
                properties:
                  notifySlack:
                    description: NotifySlack forwards violations to a webhook (P2).
                    type: boolean
                  onViolation:
                    default: report
                    description: 'OnViolation: report (inform only), pr (open a PR),
                      autofix (low-risk only).'
                    enum:
                    - report
                    - pr
                    - autofix
                    type: string
                type: object
              required:
                description: Required is what every matching workload must satisfy.
                properties:
                  concurrencyPolicy:
                    description: ConcurrencyPolicy is only meaningful for CronJobs.
                    type: string
                  image:
                    description: Image governs image tags.
                    properties:
                      tagPolicy:
                        description: ImageTagPolicy says which image tags are acceptable.
                        enum:
                        - explicit
                        - any
                        type: string
                    type: object
                  probes:
                    description: Probes mandate liveness/readiness.
                    properties:
                      liveness:
                        description: ProbePolicy says whether a probe is mandatory.
                        enum:
                        - required
                        - optional
                        type: string
                      readiness:
                        description: ProbePolicy says whether a probe is mandatory.
                        enum:
                        - required
                        - optional
                        type: string
                    type: object
                  resources:
                    description: Resources bounds CPU/memory/GPU (extended resources
                      included).
                    properties:
                      limits:
                        additionalProperties:
                          description: ResourceRule bounds a single resource quantity
                            in a template.
                          properties:
                            min:
                              description: Min is the minimum sane value. Absent means
                                "any positive value is fine".
                              type: string
                            required:
                              description: Required marks the resource as mandatory
                                (presence, not just a value).
                              type: boolean
                          type: object
                        description: Limits bounds the upper bound of each resource.
                        type: object
                      requests:
                        additionalProperties:
                          description: ResourceRule bounds a single resource quantity
                            in a template.
                          properties:
                            min:
                              description: Min is the minimum sane value. Absent means
                                "any positive value is fine".
                              type: string
                            required:
                              description: Required marks the resource as mandatory
                                (presence, not just a value).
                              type: boolean
                          type: object
                        description: Requests bounds the lower bound of each resource.
                        type: object
                    type: object
