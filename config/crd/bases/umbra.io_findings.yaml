                type: string
              state:
                allOf:
                - enum:
                  - Detected
                  - Analyzing
                  - FixProposed
                  - Verified
                  - Failed
                  - Reverted
                - enum:
                  - Detected
                  - Analyzing
                  - FixProposed
                  - Verified
                  - Failed
                  - Reverted
