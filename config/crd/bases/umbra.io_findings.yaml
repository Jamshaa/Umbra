  name: findings.umbra.io
spec:
  group: umbra.io
  names:
    kind: Finding
    listKind: FindingList
    plural: findings
    singular: finding
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Finding is the Schema for the findings API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Finding.
            properties:
              category:
                allOf:
                - enum:
                  - Resources
                  - Reliability
                  - Security
                  - RBAC
                  - Config
                - enum:
                  - Resources
                  - Reliability
                  - Security
                  - RBAC
                  - Config
                description: Category of the finding.
                type: string
              detector:
                description: Detector is the short name of the component that detected
                  the finding.
                type: string
              diagnosis:
                description: Diagnosis is the optional LLM diagnostic text.
                type: string
              prePatchManifest:
                description: PrePatchManifest is the optional pre-patch snapshot as
                  YAML, for rollback.
                type: string
              proposedPatch:
                description: ProposedPatch is the optional candidate fix as YAML.
                type: string
              severity:
                allOf:
                - enum:
                  - High
                  - Medium
                  - Low
                - enum:
                  - High
                  - Medium
                  - Low
