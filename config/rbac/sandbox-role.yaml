apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: umbra-sandbox-manager
  namespace: umbra-sandbox
rules:
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs: [get, list, watch, create, update, patch]
- apiGroups:
  - ""
  resources:
  - resourcequotas
  verbs: [get, list, watch, create, update, patch]
