---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - umbra.io
  resources:
  - findings
  - remediationpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - umbra.io
  resources:
  - findings/finalizers
  - remediationpolicies/finalizers
  verbs:
  - update
- apiGroups:
  - umbra.io
  resources:
  - findings/status
  - remediationpolicies/status
  verbs:
  - patch
  - update
# Namespace reads stay cluster-wide (discovery only, no writes).
# Mutations are pinned to the sandbox the reconciler owns; nothing else
# in the cluster can be created, updated or patched by this role.
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - namespaces
  resourceNames:
  - umbra-sandbox
  verbs:
  - create
  - update
  - patch
