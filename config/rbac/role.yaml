---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - umbra.io
  resources:
  - findings
  - remediationpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - umbra.io
  resources:
  - findings/finalizers
  - remediationpolicies/finalizers
  verbs:
  - update
- apiGroups:
  - umbra.io
  resources:
  - findings/status
  - remediationpolicies/status
  verbs:
  - patch
  - update
# Namespace creation is cluster-scoped; namespaced sandbox objects are
# restricted by the Role in sandbox-role.yaml.
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
