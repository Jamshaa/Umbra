---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - umbra.io
  resources:
  - findings
  - remediationpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - umbra.io
  resources:
  - findings/finalizers
  - remediationpolicies/finalizers
  verbs:
  - update
- apiGroups:
  - umbra.io
  resources:
  - findings/status
  - remediationpolicies/status
  verbs:
  - patch
  - update
# Sandbox objects managed by the RemediationPolicy reconciler
# (see +kubebuilder:rbac markers on RemediationPolicyReconciler).
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - ""
  resources:
  - resourcequotas
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
